name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & publish (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        run: |
          set -euo pipefail
          cp target/release/i-can-count-to-four i-can-count-to-four
          tar -czf i-can-count-to-four-linux-x86_64.tar.gz i-can-count-to-four
          sha256sum i-can-count-to-four i-can-count-to-four-linux-x86_64.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ./i-can-count-to-four \
            ./i-can-count-to-four-linux-x86_64.tar.gz \
            ./SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
