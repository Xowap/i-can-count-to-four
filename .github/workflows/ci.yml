name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # JS actions (upload-artifact) still declare a Node 20 runtime upstream;
  # opt into Node 24 to silence the deprecation.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build & test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: i-can-count-to-four-linux-x86_64
          path: target/release/i-can-count-to-four
          if-no-files-found: error
